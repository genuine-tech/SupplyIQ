    <title>SupplyChainIQ — Supply Chain Delay &amp; Inventory Risk Forecaster</title>
    <script>
      // Automatically purge rogue Service Workers & Caches on localhost
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) caches.delete(name);
        });
      }
      if (window.location.pathname === '/' || window.location.pathname === '/landing') {
        window.location.replace('/landing.html');
      }
    </script>
  </head>

    <div id="root" style="display: none !important; visibility: hidden !important; width: 0 !important; height: 0 !important; position: fixed !important; left: -99999px !important; top: -99999px !important; overflow: hidden !important; pointer-events: none !important; opacity: 0 !important; z-index: -999999 !important;" aria-hidden="true"></div>
    
    <!-- True Application Container for SupplyChainIQ -->
    <div id="supplychain-app"></div>
